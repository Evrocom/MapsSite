<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Карты заявок ТОИР</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f3f6fa;color:#18324c}
#entry{min-height:100dvh;display:grid;place-items:center;padding:24px}form{max-width:430px;width:100%;background:white;padding:32px;border-radius:16px;box-shadow:0 8px 35px #20365418}
h1{font-size:25px;margin-top:0}p{color:#506178;line-height:1.5}label{display:block;margin:20px 0 8px}input,button{font:inherit;padding:13px;border-radius:8px}input{width:100%;border:1px solid #aab6c6}button{border:0;cursor:pointer;background:#1764c0;color:white}form button{width:100%;margin-top:16px}button:disabled{opacity:.6;cursor:wait}
#message{min-height:24px;color:#b22935}#toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:white;border-bottom:1px solid #dae2ed;flex-wrap:wrap}#toolbar strong{margin-right:auto}#toolbar button{padding:9px 12px}#status{font-size:14px;color:#506178;margin:0;padding:6px 12px;min-height:28px}iframe{width:100%;height:calc(100dvh - 100px);border:0;background:white}#app[hidden],#entry[hidden]{display:none}
</style><script src="viewer.js" defer></script></head><body>
<section id="entry"><form id="login"><h1>Карты заявок ТОИР</h1><p>Карты филиалов и сводный отчёт для сотрудников.</p>
<label for="password">Общий пароль</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
<button id="enter">Открыть карты</button><p id="message" role="alert" aria-live="polite"></p></form></section>
<main id="app" hidden><nav id="toolbar"><strong>Карты заявок</strong><button id="home">Филиалы</button><button id="summary">Сводный отчёт</button><button id="excel">Excel</button><button id="logout">Выйти</button></nav>
<p id="status" role="status" aria-live="polite"></p><iframe id="content" title="Карты и сводный отчёт" sandbox="allow-scripts allow-popups allow-downloads allow-modals"></iframe></main>
</body></html>
